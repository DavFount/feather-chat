name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./web/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          grep -Fqx "version '$version'" fxmanifest.lua
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web
      - name: Validate and build UI
        run: pnpm check
        working-directory: ./web
      - name: Package resource
        uses: vimtor/action-zip@v1
        with:
          files: fxmanifest.lua LICENSE README.md config.lua client server shared ui
          recursive: false
          dest: feather-chat.zip
      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: feather-chat-install
          path: feather-chat.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: feather-chat-install
      - name: Publish tested tag artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./web/package.json').version")
          test "$TAG" = "v$version"
          grep -Fqx "version '$version'" fxmanifest.lua
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" feather-chat.zip --verify-tag --title "Feather Chat $version" --generate-notes "${flags[@]}"
